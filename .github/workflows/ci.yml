name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libsdl2-dev libsndfile1-dev jq

      - name: Build
        run: make -C backend app library-handler

      - name: Run backend tests
        working-directory: backend
        run: |
          if [ -d tests ]; then
            make test
          else
            echo "No tests/ directory tracked in this repo; skipping 'make test'."
          fi

      - name: library-handler smoke test
        working-directory: backend
        run: |
          set -euo pipefail
          # Empty request stream must exit cleanly.
          printf '' | ./library-handler --library library.example.json
          # A resolve request against the empty example library must answer
          # with a well-formed "not found" response rather than crash.
          out=$(printf '%s\n' \
            '{"request_id":"ci","action":"resolve","song":{"title":"nothing"}}' \
            | ./library-handler --library library.example.json)
          echo "$out"
          case "$out" in
            *'"request_id":"ci"'*'"ok":true'*'"found":false'*) echo "ok" ;;
            *) echo "unexpected library-handler response" >&2; exit 1 ;;
          esac

      - name: app startup smoke test
        working-directory: backend
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          set -u
          # Headless start must reach its main loop and not crash; kill it after
          # a few seconds and treat the timeout exit code (124) as success.
          timeout 5 ./app --headless library.example.json || rc=$?
          rc=${rc:-0}
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 0 ]; then
            echo "app started and ran without crashing (exit $rc)"
          else
            echo "app exited with $rc during startup" >&2
            exit "$rc"
          fi

      - name: Test suite (testing branch only)
        run: |
          if [ -x testing/run.sh ]; then
            testing/run.sh
          else
            echo "no testing/ suite on this branch"
          fi

  widget:
    name: Check widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: BarWidget.qml smoke test
        run: python3 scripts/qml-smoke.py BarWidget.qml
